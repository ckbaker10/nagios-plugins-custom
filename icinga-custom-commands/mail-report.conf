object CheckCommand "check_mail_report" {
    import "plugin-check-command"
    command = [ "/opt/nagios-plugins-lukas/check_mail_report" ]
    timeout = 40s
    arguments = {
        "--config" = {
            value = "$mail_report_config$"
            required = true
        }
        "--mode" = "$mail_report_mode$"
        "--timeout" = "$mail_report_timeout$"
        "--max-age" = "$mail_report_max_age$"
        "--warning" = "$mail_report_warning$"
        "--critical" = "$mail_report_critical$"
    }
    vars.mail_report_mode = "probe"
    vars.mail_report_timeout = 30
    vars.mail_report_max_age = 300
}

// Fixed argv matches the sudoers template; config is root-owned mode 0600.
object CheckCommand "check_mail_report_postfix" {
    import "plugin-check-command"
    command = [ "/usr/bin/sudo", "-n", "/opt/nagios-plugins-lukas/check_mail_report",
                "--mode", "postfix", "--config", "/etc/nagios/mail-report/postfix.json",
                "--timeout", "60", "--max-age", "300" ]
    timeout = 70s
}
