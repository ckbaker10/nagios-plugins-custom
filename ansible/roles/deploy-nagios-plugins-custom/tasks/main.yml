---
# Installs the prebuilt custom plugin bundle (build/build.sh) from the GitHub
# release. One x86_64 build for all distributions; nothing is built on the
# hosts and no venv/uv is needed.

- name: Skip hosts that are not x86_64
  when: ansible_facts['architecture'] != 'x86_64'
  block:
    - name: Report unsupported architecture
      ansible.builtin.debug:
        msg: "nagios-plugins-custom is only built for x86_64, skipping {{ ansible_facts['architecture'] }}"
    - name: End play for this host
      ansible.builtin.meta: end_host

- name: Install helper programs
  ansible.builtin.package:
    name: "{{ nagios_plugins_custom_packages[ansible_facts['os_family']] }}"
    state: present
  when: ansible_facts['os_family'] != 'Suse'

# ansible-core has no zypper backend for the generic package module
- name: Install helper programs (SUSE)
  community.general.zypper:
    name: "{{ nagios_plugins_custom_packages['Suse'] }}"
    state: present
  when: ansible_facts['os_family'] == 'Suse'

- name: Download bundle from GitHub release
  ansible.builtin.get_url:
    url: "{{ nagios_plugins_custom_release_url }}/{{ nagios_plugins_custom_tarball }}"
    dest: "{{ nagios_plugins_custom_tmp_dir }}/{{ nagios_plugins_custom_tarball }}"
    checksum: "sha256:{{ nagios_plugins_custom_release_url }}/{{ nagios_plugins_custom_tarball }}.sha256"
    mode: '0644'
  register: nagios_plugins_custom_download

- name: Check installed bundle
  ansible.builtin.stat:
    path: "{{ nagios_plugins_custom_install_prefix }}/BUILDINFO"
  register: nagios_plugins_custom_buildinfo

- name: Remove previous installation of this version
  ansible.builtin.file:
    path: "{{ nagios_plugins_custom_install_prefix }}"
    state: absent
  when: nagios_plugins_custom_download is changed

- name: Unpack bundle
  ansible.builtin.unarchive:
    src: "{{ nagios_plugins_custom_tmp_dir }}/{{ nagios_plugins_custom_tarball }}"
    dest: /
    remote_src: true
  when: nagios_plugins_custom_download is changed or not nagios_plugins_custom_buildinfo.stat.exists

# unarchive can report success without extracting anything when tar fails
- name: Verify unpacked bundle
  ansible.builtin.stat:
    path: "{{ nagios_plugins_custom_install_prefix }}/BUILDINFO"
  register: nagios_plugins_custom_unpacked
  failed_when: not nagios_plugins_custom_unpacked.stat.exists

# check_lpr binds a privileged source port (RFC 1179). The bundled python
# loads libpython via $ORIGIN, which the loader ignores for binaries with
# capabilities, so a copy of the system python gets cap_net_bind_service.
- name: Find system python for check_lpr
  ansible.builtin.command:
    cmd: python3 -c 'import os, sys; print(os.path.realpath(sys.executable))'
  register: nagios_plugins_custom_system_python
  changed_when: false
  failed_when: false

- name: Copy system python for check_lpr
  ansible.builtin.copy:
    src: "{{ nagios_plugins_custom_system_python.stdout }}"
    dest: "{{ nagios_plugins_custom_install_prefix }}/python3-lpr"
    remote_src: true
    mode: '0755'
  register: nagios_plugins_custom_lpr_python
  when: nagios_plugins_custom_system_python.rc == 0

- name: Check capabilities of python3-lpr
  ansible.builtin.command:
    cmd: "getcap {{ nagios_plugins_custom_install_prefix }}/python3-lpr"
  register: nagios_plugins_custom_getcap
  changed_when: false
  when: nagios_plugins_custom_system_python.rc == 0

- name: Allow python3-lpr to bind privileged ports
  ansible.builtin.command:
    cmd: "setcap cap_net_bind_service=+ep {{ nagios_plugins_custom_install_prefix }}/python3-lpr"
  changed_when: true
  when:
    - nagios_plugins_custom_system_python.rc == 0
    - "'cap_net_bind_service' not in nagios_plugins_custom_getcap.stdout"

# Before 1.1.0 the stable path was a git checkout with a per-host venv; keep
# it as a backup instead of deleting it
- name: Check stable path
  ansible.builtin.stat:
    path: "{{ nagios_plugins_custom_link }}"
  register: nagios_plugins_custom_link_stat

- name: Move old git checkout aside
  ansible.builtin.command:
    cmd: "mv {{ nagios_plugins_custom_link }} {{ nagios_plugins_custom_link }}.pre-{{ nagios_plugins_custom_version }}"
    creates: "{{ nagios_plugins_custom_link }}.pre-{{ nagios_plugins_custom_version }}"
  when:
    - nagios_plugins_custom_link_stat.stat.exists
    - nagios_plugins_custom_link_stat.stat.isdir
    - not nagios_plugins_custom_link_stat.stat.islnk

- name: Point {{ nagios_plugins_custom_link }} to {{ nagios_plugins_custom_version }}
  ansible.builtin.file:
    src: "{{ nagios_plugins_custom_install_prefix }}"
    dest: "{{ nagios_plugins_custom_link }}"
    state: link
    force: true

- name: Create goss directory
  ansible.builtin.file:
    path: "{{ nagios_plugins_custom_goss_dir }}"
    state: directory
    owner: "{{ nagios_plugins_custom_user }}"
    group: "{{ nagios_plugins_custom_user }}"
    mode: '0755'

# check_compose talks to the Docker daemon
- name: Check for docker group
  ansible.builtin.getent:
    database: group
    key: docker
    fail_key: false

- name: Add check user to docker group
  ansible.builtin.user:
    name: "{{ nagios_plugins_custom_user }}"
    groups: docker
    append: true
  when: getent_group.docker is not none

- name: Locate smartctl and hddtemp
  ansible.builtin.shell:
    cmd: "command -v {{ item }} || true"
  loop: [smartctl, hddtemp]
  register: nagios_plugins_custom_bins
  changed_when: false

- name: Set binary paths for sudoers
  ansible.builtin.set_fact:
    nagios_plugins_custom_smartctl: "{{ nagios_plugins_custom_bins.results[0].stdout | default('', true) or '/usr/sbin/smartctl' }}"
    nagios_plugins_custom_hddtemp: "{{ nagios_plugins_custom_bins.results[1].stdout | default('', true) }}"

- name: Install sudoers rules
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/nagios-plugins
    owner: root
    group: root
    mode: '0440'
    validate: visudo -cf %s

# SMS notifications (notify_sms): only on agents that can reach the LTE
# router. A dedicated user owns the router key; the Icinga master reaches it
# via SSH with a key that may only run "notify_sms --relay" (Icinga 2 cannot
# run notification commands on an agent). The router side is set up with
# sms-gateway/install.sh using the key printed below.
- name: Set up SMS relay
  when: nagios_plugins_custom_sms_gateway | length > 0
  block:
    - name: Create SMS relay user
      ansible.builtin.user:
        name: "{{ nagios_plugins_custom_sms_user }}"
        system: true
        shell: /bin/sh
        home: "/var/lib/{{ nagios_plugins_custom_sms_user }}"
        create_home: true
        password: "!"
        comment: Icinga SMS relay

    - name: Create SSH directory of the relay user
      ansible.builtin.file:
        path: "/var/lib/{{ nagios_plugins_custom_sms_user }}/.ssh"
        state: directory
        owner: "{{ nagios_plugins_custom_sms_user }}"
        group: "{{ nagios_plugins_custom_sms_user }}"
        mode: '0700'

    - name: Generate router key
      community.crypto.openssh_keypair:
        path: "/var/lib/{{ nagios_plugins_custom_sms_user }}/.ssh/icinga-sms"
        type: ed25519
        comment: "icinga-sms@{{ ansible_facts['hostname'] }}"
        owner: "{{ nagios_plugins_custom_sms_user }}"
        group: "{{ nagios_plugins_custom_sms_user }}"
      register: nagios_plugins_custom_sms_key

    - name: Read router host key
      ansible.builtin.command:
        cmd: "ssh-keyscan -t ed25519 {{ nagios_plugins_custom_sms_gateway }}"
      register: nagios_plugins_custom_sms_hostkey
      changed_when: false

    - name: Store router host key
      ansible.builtin.copy:
        content: "{{ nagios_plugins_custom_sms_hostkey.stdout }}\n"
        dest: "/var/lib/{{ nagios_plugins_custom_sms_user }}/.ssh/known_hosts_icinga_sms"
        owner: "{{ nagios_plugins_custom_sms_user }}"
        group: "{{ nagios_plugins_custom_sms_user }}"
        mode: '0644'

    - name: Authorize relay keys (forced command notify_sms --relay)
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (deploy-nagios-plugins-custom)
          {% for k in nagios_plugins_custom_sms_relay_keys %}
          {{ 'from="' ~ k.from ~ '",' if k.from | default('') else '' }}command="{{ nagios_plugins_custom_link }}/notify_sms --relay --gateway root@{{ nagios_plugins_custom_sms_gateway }} --identity /var/lib/{{ nagios_plugins_custom_sms_user }}/.ssh/icinga-sms --known-hosts /var/lib/{{ nagios_plugins_custom_sms_user }}/.ssh/known_hosts_icinga_sms",no-pty,no-port-forwarding,no-agent-forwarding,no-X11-forwarding {{ k.key }}
          {% endfor %}
        dest: "/var/lib/{{ nagios_plugins_custom_sms_user }}/.ssh/authorized_keys"
        owner: "{{ nagios_plugins_custom_sms_user }}"
        group: "{{ nagios_plugins_custom_sms_user }}"
        mode: '0600'

    - name: Show public key to authorize on the router
      ansible.builtin.debug:
        msg: "sms-gateway/install.sh root@{{ nagios_plugins_custom_sms_gateway }} <pubkey> +49...: {{ nagios_plugins_custom_sms_key.public_key }}"

# check_lte_router: the check user reads the router status via SSH with a
# key that may only run icinga-lte-status there (router side:
# sms-gateway/install-status.sh with the key printed below)
- name: Set up LTE router status key
  when: nagios_plugins_custom_lte_router | length > 0
  block:
    - name: Find home of the check user
      ansible.builtin.getent:
        database: passwd
        key: "{{ nagios_plugins_custom_user }}"

    - name: Set SSH directory of the check user
      ansible.builtin.set_fact:
        nagios_plugins_custom_check_ssh_dir: "{{ getent_passwd[nagios_plugins_custom_user][4] }}/.ssh"

    - name: Create SSH directory of the check user
      ansible.builtin.file:
        path: "{{ nagios_plugins_custom_check_ssh_dir }}"
        state: directory
        owner: "{{ nagios_plugins_custom_user }}"
        group: "{{ nagios_plugins_custom_user }}"
        mode: '0700'

    - name: Generate LTE status key
      community.crypto.openssh_keypair:
        path: "{{ nagios_plugins_custom_check_ssh_dir }}/icinga-lte"
        type: ed25519
        comment: "icinga-lte@{{ ansible_facts['hostname'] }}"
        owner: "{{ nagios_plugins_custom_user }}"
        group: "{{ nagios_plugins_custom_user }}"
      register: nagios_plugins_custom_lte_key

    - name: Read router host key for check_lte_router
      ansible.builtin.command:
        cmd: "ssh-keyscan -t ed25519 {{ nagios_plugins_custom_lte_router }}"
      register: nagios_plugins_custom_lte_hostkey
      changed_when: false

    - name: Store router host key for check_lte_router
      ansible.builtin.copy:
        content: "{{ nagios_plugins_custom_lte_hostkey.stdout }}\n"
        dest: "{{ nagios_plugins_custom_check_ssh_dir }}/known_hosts_icinga_lte"
        owner: "{{ nagios_plugins_custom_user }}"
        group: "{{ nagios_plugins_custom_user }}"
        mode: '0644'

    - name: Show public key to authorize on the router
      ansible.builtin.debug:
        msg: "sms-gateway/install-status.sh root@{{ nagios_plugins_custom_lte_router }} <pubkey>: {{ nagios_plugins_custom_lte_key.public_key }}"

- name: Set up local Postfix mail report probe
  when: nagios_plugins_custom_mail_report_postfix | length > 0
  block:
    - name: Create private mail report configuration directory
      ansible.builtin.file:
        path: /etc/nagios/mail-report
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install private Postfix probe configuration
      ansible.builtin.copy:
        content: "{{ nagios_plugins_custom_mail_report_postfix | to_nice_json }}\n"
        dest: /etc/nagios/mail-report/postfix.json
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Authorize only the fixed Postfix probe command
      ansible.builtin.template:
        src: mail-report-sudoers.j2
        dest: /etc/sudoers.d/nagios-mail-report
        owner: root
        group: root
        mode: '0440'
        validate: visudo -cf %s

- name: Verify installation
  ansible.builtin.command:
    cmd: "{{ nagios_plugins_custom_link }}/check_lm_sensors --version"
  become: true
  become_user: "{{ nagios_plugins_custom_user }}"
  register: nagios_plugins_custom_verify
  changed_when: false

- name: Display installation summary
  ansible.builtin.debug:
    msg:
      - "{{ nagios_plugins_custom_verify.stdout }}"
      - "Plugin directory: {{ nagios_plugins_custom_link }} -> {{ nagios_plugins_custom_install_prefix }}"
